name: Deploy to GitHub Pages
# Push to main → test, build, deploy.
# Every 3 hours (and by hand) → also refresh the NASA data that changes daily (DONKI last 30 days, APOD)
# before building. A failed or strange answer keeps the committed snapshot (ingest) or fails the
# schema tests (npm test), so the last good site stays up. History datasets (May 2024) never change here.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      group:
        description: "Data to refresh before building (recent | history,recent,curated | none)"
        default: recent
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh NASA data (scheduled / manual runs only)
        if: github.event_name != 'push' && inputs.group != 'none'
        continue-on-error: true
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          GROUP: ${{ inputs.group || 'recent' }}
        run: npm run ingest -- --group="$GROUP"
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
